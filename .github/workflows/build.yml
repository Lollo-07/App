name: Build APK Android

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v3

      - name: Installa Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev

      - name: Installa Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK (debug)
        run: buildozer android debug

      - name: Salva l'APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: app-spese-debug
          path: bin/*.apk